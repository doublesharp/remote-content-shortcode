name: Publish to WordPress SVN

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-svn-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  publish:
    name: ${{ github.event_name == 'workflow_dispatch' && 'SVN dry run' || 'SVN release' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release version and branch
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            VERSION=$(python3 tools/release-version.py --tag "$RELEASE_TAG")
          else
            VERSION=$(python3 tools/release-version.py)
          fi
          git merge-base --is-ancestor HEAD origin/main
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Inspect the SVN version
        id: svn-version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! command -v svn >/dev/null; then
            timeout 120 sudo apt-get update
            timeout 120 sudo apt-get install -y subversion
          fi
          timeout 60 svn list --xml --non-interactive \
            https://plugins.svn.wordpress.org/remote-content-shortcode/tags/ > "$RUNNER_TEMP/svn-tags.xml"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          tags = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'svn-tags.xml')
          exists = any(name.text == os.environ['VERSION'] for name in tags.findall('.//entry/name'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('exists=' + str(exists).lower() + '\n')
          if exists:
              print('SVN version already exists; its contents must match before recovery can continue.')
          PY
      - name: Build the release ZIP in Docker
        run: |
          mkdir -p "$RUNNER_TEMP/rcs-release"
          timeout 120 docker pull wordpress:cli-php8.2
          timeout 30 docker run --rm --user "$(id -u):$(id -g)" \
            -e GITHUB_ACTIONS=true -e RUNNER_TEMP \
            -v "$GITHUB_WORKSPACE:/source:ro" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            --entrypoint php wordpress:cli-php8.2 \
            /source/tools/package.php "$RUNNER_TEMP/rcs-release/plugin.zip"
          unzip -q "$RUNNER_TEMP/rcs-release/plugin.zip" -d "$RUNNER_TEMP/rcs-release"
      - name: Verify an existing SVN version before resuming
        if: steps.svn-version.outputs.exists == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          timeout 60 svn export --non-interactive \
            "https://plugins.svn.wordpress.org/remote-content-shortcode/tags/$VERSION" \
            "$RUNNER_TEMP/rcs-svn-existing"
          diff -qr "$RUNNER_TEMP/rcs-release/remote-content-shortcode" "$RUNNER_TEMP/rcs-svn-existing"
      - name: Check deployment configuration
        env:
          SVN_USERNAME: ${{ vars.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ vars.PLUGIN_SLUG }}
        run: |
          test "$SLUG" = remote-content-shortcode
          test -n "$SVN_USERNAME"
          test -n "$SVN_PASSWORD"
      - name: Deploy the packaged files to SVN
        if: steps.svn-version.outputs.exists != 'true'
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SVN_USERNAME: ${{ vars.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ vars.PLUGIN_SLUG }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: ${{ runner.temp }}/rcs-release/remote-content-shortcode
      - name: Verify the published SVN tag matches the package
        if: github.event_name == 'push' && steps.svn-version.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          timeout 60 svn export --non-interactive \
            "https://plugins.svn.wordpress.org/remote-content-shortcode/tags/$VERSION" \
            "$RUNNER_TEMP/rcs-svn-verify"
          diff -qr "$RUNNER_TEMP/rcs-release/remote-content-shortcode" "$RUNNER_TEMP/rcs-svn-verify"
      - name: Record deployment result
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          SVN_EXISTS: ${{ steps.svn-version.outputs.exists }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "SVN dry run completed for $VERSION. No SVN commit was made." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SVN_EXISTS" = true ]; then
            echo "Existing SVN version $VERSION matches the package. Resuming GitHub release publication without an SVN commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Version $VERSION uploaded to WordPress SVN. Directory reopening and release confirmation are separate." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Prepare GitHub release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp "$RUNNER_TEMP/rcs-release/plugin.zip" \
            "$RUNNER_TEMP/rcs-release/remote-content-shortcode-$VERSION.zip"
          cd "$RUNNER_TEMP/rcs-release"
          sha256sum "remote-content-shortcode-$VERSION.zip" > "remote-content-shortcode-$VERSION.zip.sha256"
          sha256sum --check "remote-content-shortcode-$VERSION.zip.sha256"
          cd "$GITHUB_WORKSPACE"
          python3 tools/github-release.py --prepare-only \
            --tag "$VERSION" --version "$VERSION" --directory "$RUNNER_TEMP/rcs-release"
      - name: Retain verified ZIP and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordpress-release-${{ steps.version.outputs.version }}
          path: |
            ${{ runner.temp }}/rcs-release/remote-content-shortcode-${{ steps.version.outputs.version }}.zip
            ${{ runner.temp }}/rcs-release/remote-content-shortcode-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/github-release.py \
            --tag "$RELEASE_TAG" --version "$VERSION" \
            --directory "$RUNNER_TEMP/rcs-release"
