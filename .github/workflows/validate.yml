name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.6'
            php: '8.2'
          - wordpress: '7.1.3'
            php: '8.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release metadata
        run: python3 tools/release-version.py
      - name: Verify release asset publication safeguards
        run: timeout 30 python3 tests/release-assets.py
      - name: Run bounded Docker checks
        env:
          RCS_WORDPRESS_VERSION: ${{ matrix.wordpress }}
          RCS_PHP_VERSION: ${{ matrix.php }}
        run: python3 tools/ci.py
      - name: Upload release ZIP and check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordpress-${{ matrix.wordpress }}-php-${{ matrix.php }}
          path: |
            ${{ runner.temp }}/remote-content-shortcode/reports/*.txt
            ${{ runner.temp }}/remote-content-shortcode/reports/*.zip
          if-no-files-found: error
          retention-days: 14
