name: rcs-wordpress

x-wordpress: &wordpress
  env_file: ../../.local-wordpress/runtime.env
  volumes:
    - ../../.local-wordpress/wordpress:/var/www/html
    - ${RCS_WP_SCRATCH:?Run python3 tools/wordpress/site.py up first}:/workspace-output
    - ${RCS_WP_SCRATCH}/tmp:/tmp
    - .:/workspace-tools:ro
  depends_on:
    database:
      condition: service_healthy

services:
  database:
    image: mariadb:11.4@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    restart: unless-stopped
    env_file: ../../.local-wordpress/database.env
    volumes:
      - ../../.local-wordpress/database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m
    cpus: 1

  wordpress:
    <<: *wordpress
    image: wordpress:7.1.4-php8.3-apache@sha256:1f59452d2ceed177ad383d17b3a6a7a5c8225d89e34adb36880af8603ac244c2
    restart: unless-stopped
    ports:
      - 127.0.0.1:8088:80
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://localhost/wp-login.php]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    cpus: 1

  cli:
    <<: *wordpress
    image: wordpress:cli-2.12.0-php8.3@sha256:6bcc7bb91f5157c4b915e74ee131873e99c1c1ff48f602e4a6f6cd17827305cb
    user: '33:33'
    profiles: [tools]
    environment:
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    entrypoint: [wp]
    mem_limit: 512m
    cpus: 1
